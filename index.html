<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026년 인사지원부 회식톡톡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="color-scheme" content="light dark" />
  <style>
    :root{ --note-rotate: 0deg; }
    .note{ box-shadow: 0 6px 18px rgba(2,6,23,.14); transform: rotate(var(--note-rotate)); position: relative; }
    .note:before{ content:""; position:absolute; left:50%; top:-10px; width:70px; height:18px; transform:translateX(-50%) rotate(-2deg); background:repeating-linear-gradient(45deg, rgba(0,0,0,.08), rgba(0,0,0,.08) 6px, transparent 6px, transparent 12px); border-radius:4px; }
    .grid-masonry{ column-width: 260px; column-gap: 1rem; }
    .break-inside{ break-inside: avoid; }
    .del-btn{ position:absolute; top:6px; right:6px; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; border-radius:9999px; background:rgba(0,0,0,.08); color:#1f2937; opacity:.0; transition:opacity .15s ease, transform .08s ease; }
    .note:hover .del-btn{ opacity:1; }
    .del-btn:active{ transform:scale(.95); }
  </style>
</head>
<body class="min-h-screen bg-amber-50 text-gray-900 dark:bg-stone-900 dark:text-stone-100">
  <div class="max-w-6xl mx-auto p-6">
    <header class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">🎊인사부 회식톡톡🎊 (익명이니 안심하세요!)</h1>
        <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">닉네임으로만 제출 · 누군가 제출하면 화면에 포스트잇처럼 바로 붙어요.<span id="realtimeHint" class="ml-2"></span></p>
      </div>
      <div class="flex items-center gap-2">
        <button id="exportCsvBtn" class="px-3 py-1.5 rounded-xl border border-gray-300 dark:border-gray-700 text-sm hover:bg-white/70 dark:hover:bg-white/10">CSV 내보내기</button>
        <button id="clearBtn" class="px-3 py-1.5 rounded-xl border border-red-300 text-red-600 text-sm hover:bg-red-50 dark:hover:bg-red-900/30">모두 지우기</button>
      </div>
    </header>
    
    <div class="w-full max-w-md mx-auto">
      <img src="IMG_6900.jpeg"
           class="w-full h-auto sm:w-[300px] sm:h-[300px] sm:object-cover mx-auto rounded-xl">

    </div>
    <section class="bg-white/90 dark:bg-stone-800/80 rounded-2xl shadow-sm ring-1 ring-gray-200 dark:ring-stone-700 p-5 mb-6">
      <form id="form" class="grid sm:grid-cols-[220px_1fr_auto] gap-3 items-start" novalidate>
        <div>
          <label for="nick" class="block text-sm font-medium mb-1">닉네임</label>
          <input id="nick" name="nick" type="text" required maxlength="24" class="w-full rounded-xl border-gray-300 dark:border-stone-600 bg-white dark:bg-stone-900 px-3 py-2" placeholder="예: 소금빵러버" />
        </div>
        <div class="sm:col-span-1">
          <label for="text" class="block text-sm font-medium mb-1">의견</label>
          <textarea id="text" name="text" rows="3" required maxlength="800" class="w-full rounded-xl border-gray-300 dark:border-stone-600 bg-white dark:bg-stone-900 px-3 py-2" placeholder="자유롭게 적어주세요 (800자 이내)"></textarea>
          <p class="mt-1 text-xs text-gray-500">민감정보나 나쁜말은 금지! 제출 즉시 게시판에 표시됩니다.</p>
          <p class="mt-1 text-xs text-green-600 dark:text-green-400">걱정 마세요! 익명 의견은 어디에도 저장되지 않고, 이 자리에서만 보입니다.</p>
        </div>
        <div class="flex gap-2 sm:self-end">
          <button type="submit" class="h-10 px-4 rounded-xl bg-amber-500 text-white font-medium hover:bg-amber-600">붙이기</button>
          <button type="button" id="randomBtn" class="h-10 px-3 rounded-xl border border-gray-300 dark:border-stone-600 text-sm">랜덤 닉네임</button>
        </div>
      </form>
    </section>

    <section>
      <div id="board" class="grid-masonry"></div>
      <p id="empty" class="text-center text-sm text-gray-500 mt-10">아직 의견이 없습니다. 첫 번째 포스트잇을 붙여보세요!</p>
    </section>

    <footer class="mt-10 text-center text-xs text-gray-500 dark:text-stone-400">
      <p>© <span id="year"></span> 노사문화팀이 즐거운 회식을 위해 함께 제작하였습니다 🫡</p>
    </footer>

    <details id="test-panel" class="mt-6 text-xs text-gray-600 dark:text-gray-400" hidden>
      <summary class="cursor-pointer select-none">Self Tests</summary>
      <ul id="test-results" class="list-disc pl-5"></ul>
    </details>
  </div>

  <template id="noteTemplate">
    <article class="note relative break-inside p-5 pt-7 rounded-xl mb-4 text-gray-900" data-id>
      <button type="button" class="del-btn" aria-label="삭제" title="삭제" data-del>
        <span aria-hidden="true">×</span>
      </button>
      <div class="text-xs opacity-80 mb-2 leading-normal" data-ts></div>
<h3 class="font-semibold mb-2 leading-normal" data-nick></h3>
<p class="whitespace-pre-wrap leading-relaxed" data-text></p>
    </article>
  </template>

  <script type="module">
    const STORAGE_KEY = 'anon_notes_v1';
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCXEjUQJ6CRbAo0DjSGlU_LSB3Rabj1NVM",
      authDomain: "workshop-kdic.firebaseapp.com",
      projectId: "workshop-kdic",
      storageBucket: "workshop-kdic.firebasestorage.app",
      messagingSenderId: "253525145405",
      appId: "1:253525145405:web:d8e849aab1a1b9c98d7754",
      measurementId: "G-WS29JEPJXF"
    };
    const COLLECTION = 'notes';

    const state = { items: loadLocal(), useCloud: Boolean(FIREBASE_CONFIG) };

    const $  = (s, el=document) => el.querySelector(s);
    const $$ = (s, el=document) => [...el.querySelectorAll(s)];
    const colors = ['#FEF08A','#FDE68A','#FECACA','#BFDBFE','#BBF7D0','#FBCFE8','#DDD6FE'];
    function nowTs(){ return Date.now(); }
    function fmt(ts){ if(!ts) return ''; const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
    function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
    function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

    function loadLocal(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }catch{ return []; } }
    function saveLocal(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items)); }

    const board = $('#board');
    const empty = $('#empty');
    function render(items){
      board.innerHTML = '';
      if(!items.length){ empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');
      items.slice().sort((a,b)=>b.ts-a.ts).forEach(addNoteEl);
    }
    function addNoteEl(item){
      const tpl = $('#noteTemplate').content.cloneNode(true);
      const art = tpl.querySelector('article');
      art.dataset.id = item.id;
      art.style.background = item.color || pick(colors);
      art.style.setProperty('--note-rotate', (item.rotate||((Math.random()*4)-2).toFixed(2))+ 'deg');
      $('[data-ts]', tpl).textContent = fmt(item.ts);
      $('[data-nick]', tpl).textContent = item.nick;
      $('[data-text]', tpl).textContent = item.text;
      board.appendChild(tpl);
    }

    const form = $('#form');
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const nick = $('#nick').value.trim();
      const text = $('#text').value.trim();
      if(!nick || !text){ return; }
      const item = { id: uid(), nick, text, ts: nowTs(), color: pick(colors) };
      state.items.push(item); saveLocal(); render(state.items); empty.classList.add('hidden');
      form.reset();
      localStorage.setItem('last_change', String(item.ts));
      if(state.useCloud){ try { await addCloud(item); } catch(e){ console.warn('업로드 실패:', e); } }
    });

    const animals = ['고래','호랑이','판다','수달','매','부엉이','토끼','돌고래','너구리','여우'];
    const colorsKo = ['파란','초록','보라','노랑','주황','하얀','검은','은빛','하늘','분홍'];
    $('#randomBtn').addEventListener('click', ()=>{ $('#nick').value = pick(colorsKo)+pick(animals); });

    window.addEventListener('storage', (e)=>{ if(e.key==='last_change'){ state.items = loadLocal(); render(state.items); } });

    $('#exportCsvBtn').addEventListener('click', ()=>{
      const headers = ['id','nick','text','ts','datetime'];
      const rows = [headers.join(',')].concat(state.items.map(x=> headers.map(h=>csvCell(h==='datetime'?fmt(x.ts):x[h])).join(',')));
      const csv = "\uFEFF" + rows.join('\r\n');
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=`notes_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });
    function csvCell(v){ const s=(v==null?'':String(v)).replace(/"/g,'""'); return '"'+s+'"'; }

    $('#clearBtn').addEventListener('click', ()=>{ if(confirm('모든 로컬 포스트잇을 삭제할까요?')){ state.items = []; saveLocal(); render(state.items); } });

    board.addEventListener('click', async (e)=>{
      const btn = e.target.closest('[data-del]');
      if(!btn) return;
      const art = btn.closest('[data-id]');
      const id = art?.dataset.id;
      if(!id) return;
      state.items = state.items.filter(x => x.id !== id);
      saveLocal();
      render(state.items);
      if(state.useCloud){
        try { await deleteCloud(id); }
        catch(err){ console.warn('클라우드 삭제 실패:', err); }
      }
    });

    $('#year').textContent = new Date().getFullYear();
    render(state.items);

    const hint = $('#realtimeHint');
    if(state.useCloud){ hint.textContent = ' (실시간 동기화: 클라우드 활성)'; initCloud(); }
    else { hint.textContent = ' (여러 사람이 동시에 보려면 클라우드 연동이 필요합니다)'; }

    async function initCloud(){
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js');
      const { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, limit, deleteDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js');
      const app = initializeApp(FIREBASE_CONFIG);
      const db = getFirestore(app);
      const col = collection(db, COLLECTION);

      const q = query(col, orderBy('ts','desc'), limit(300));
      onSnapshot(q, (snap)=>{
        const list = [];
        snap.forEach(docSnap=>{
          const d = docSnap.data();
          list.push({
            id: docSnap.id,
            nick: d.nick,
            text: d.text,
            ts: d.ts?.toMillis ? d.ts.toMillis() : d.ts,
            color: d.color,
            rotate: d.rotate
          });
        });
        state.items = list; saveLocal(); render(state.items);
      });

      addCloud    = async (item)=>{ await addDoc(col, { ...item, ts: serverTimestamp() }); };
      deleteCloud = async (id)=>{ await deleteDoc(doc(db, COLLECTION, id)); };
    }

    let addCloud = async ()=>{};
    let deleteCloud = async ()=>{};

    (function runSelfTests(){
      const panel = document.getElementById('test-panel');
      const list  = document.getElementById('test-results');
      const add = (ok, name, info='')=>{
        const li = document.createElement('li');
        li.textContent = (ok? '✅ ' : '❌ ') + name + (info? ' – '+info : '');
        list.appendChild(li);
        if(!ok) panel.hidden = false;
      };
      try {
        const sample = fmt(0);
        add(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(sample), 'fmt() 형식 검증', sample);
        add(csvCell('a"b') === '"a""b"', 'csvCell() 따옴표 이스케이프');
        add(!!document.getElementById('form') && !!document.getElementById('board'), '핵심 DOM 존재');
        const testCsv = (function(){ const rows=['a,b','c,d']; return "\uFEFF"+rows.join('\r\n'); })();
        add(testCsv.includes('\r\n'), 'CSV 줄바꿈 CRLF 포함');
        const t = document.getElementById('noteTemplate').content.cloneNode(true);
        add(!!t.querySelector('[data-del]'), '삭제 버튼 존재 확인');
      } catch (err){
        add(false, 'Self test 예외', String(err));
        console.error('[SelfTests]', err);
      }
    })();
  </script>
</body>
</html>
